plugins { id 'com.android.application' }
android {
    namespace 'com.flipyear.album'
    compileSdk 35
    defaultConfig { applicationId 'com.flipyear.album'; minSdk 26; targetSdk 34; versionCode 14; versionName '2.8.1' }
    signingConfigs {
        debug { storeFile rootProject.file('signing/flipyear-debug.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
