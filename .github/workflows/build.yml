name: Build and test FlipYear
on:
  push:
    branches: [main, "codex/**"]
    paths-ignore:
      - "releases/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flipyear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$manager"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate web edition
        run: python3 scripts/build-web.py
      - name: JavaScript syntax
        run: |
          node --check app/src/main/assets/yearbook.js
          node --check app/src/main/assets/photo-viewer.js
          node --check app/src/main/assets/original-media.js
          node --check app/src/main/assets/webgl-yearbook.js
          node --check app/src/main/assets/photo-detail.js
          node --check app/src/main/assets/reader-fullscreen.js
          node --check tests/yearbook.cjs
          node --check app/src/main/assets/daily-journal.js
      - name: Java policy regression tests
        run: |
          bash tests/native-policy.sh
      - name: Browser regression tests
        run: |
          npm install --no-save playwright@1.56.1 sharp@0.34.5
          npx playwright install --with-deps chromium
          node tests/functional.cjs
          node tests/yearbook.cjs
          node tests/daily-journal.cjs
          node tests/photo-viewer.cjs
          node tests/widgets.cjs
          node tests/videos.cjs
          node tests/custom-videos.cjs
          node tests/original-media.cjs
          node tests/webgl-yearbook.cjs
          node tests/photo-detail.cjs
          node tests/photo-frame.cjs
          node tests/reader-fullscreen.cjs
      - name: Resolve APK version
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as e; print(e.parse('app/src/main/AndroidManifest.xml').getroot().attrib['{http://schemas.android.com/apk/res/android}versionName'])")
          echo "FLIPYEAR_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build signed development APK
        run: bash build-android.sh
      - name: Upload verified development APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipYear-v${{ env.FLIPYEAR_VERSION }}-debug-apk
          path: FlipYear-v${{ env.FLIPYEAR_VERSION }}.apk
          if-no-files-found: error
          retention-days: 7
